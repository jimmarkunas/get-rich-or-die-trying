name: Read-only market snapshot

# First deployment gate: public Kalshi API diagnostics only.
# NO account auth, no orders, no blockchain transactions, no secrets.
on:
  push:
    branches: [main]
    paths:
      - 'alpha/**'
      - 'config.example.json'
      - '.github/workflows/read-only-scan.yml'
  workflow_dispatch:
  schedule:
    # Deliberately offset from minute zero. GitHub schedules may be delayed.
    - cron: '17 * * * *'

permissions:
  contents: read

concurrency:
  group: automated-alpha-read-only-snapshot
  cancel-in-progress: false

jobs:
  kalshi-public-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run isolated tests
        run: python -m unittest discover -s tests -v
      - name: Build temporary public-only configuration
        run: cp config.example.json config.json
      - name: Observe Kalshi public markets (read only)
        run: python -m alpha scan --config config.json --engine kalshi --ledger output/opportunities.jsonl
      - name: Generate HTML report
        if: always()
        run: python -m alpha report --ledger output/opportunities.jsonl --out output/dashboard.html
      - name: Upload observations and dashboard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpha-snapshot-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            output/dashboard.html
            output/opportunities.jsonl
          if-no-files-found: warn
          retention-days: 7
