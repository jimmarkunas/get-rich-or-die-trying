name: Crypto spot paper research (no trading)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'alpha/crypto_*.py'
      - '.github/workflows/crypto-paper.yml'
      - 'tests/test_crypto.py'
      - 'tests/test_crypto_health.py'
  schedule:
    - cron: '13 * * * *'
  # Recover when the :13 scheduled event is dropped, using an independent
  # read-only workflow completion. Runs are idempotent for the same closed bar.
  workflow_run:
    workflows: [Read-only market snapshot]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: automated-alpha-crypto-paper
  cancel-in-progress: false

jobs:
  crypto:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: All read-only regression tests
        run: python -m unittest discover -s tests -q
      - name: Fetch prior independent paper state
        run: |
          set -euo pipefail
          git fetch origin alpha-crypto-history:refs/remotes/origin/alpha-crypto-history
          mkdir -p output
          git show origin/alpha-crypto-history:history/paper-state.json > output/previous-paper-state.json || :
          git show origin/alpha-crypto-history:history/paper-observations.jsonl > output/previous-paper-observations.jsonl || :
          git show origin/alpha-crypto-history:history/latest-backtest.json > output/crypto-backtest.json || :
      - name: Forward-only spot paper simulation using observed public bid/ask
        run: |
          python -m alpha.crypto_cli forward \
            --state-in output/previous-paper-state.json \
            --state-out output/new-paper-state.json \
            --observations output/crypto-paper-observations.jsonl
      - name: 90-day historical training and out-of-sample holdout
        # Preserve transparency: scheduled hourly tests are purposely bounded;
        # the external-fetch backtest only runs at 05 UTC or on a push/manual run.
        run: |
          if [ '${{ github.event_name }}' = 'workflow_dispatch' ] || [ '${{ github.event_name }}' = 'push' ] || [ "$(date -u +%H)" = '05' ]; then
            python -m alpha.crypto_cli backtest --days 90 --out output/crypto-backtest.json
          else
            echo 'Backtest runs on publish/manual and once daily near 05 UTC.'
          fi
      - name: Generate the readable paper/backtest scoreboard
        run: python -m alpha.crypto_dashboard --backtest output/crypto-backtest.json --state output/new-paper-state.json --out output/crypto-dashboard.html
      - name: Persist public research state (isolated branch)
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/crypto-history" origin/alpha-crypto-history
          mkdir -p "$RUNNER_TEMP/crypto-history/history"
          cp output/new-paper-state.json "$RUNNER_TEMP/crypto-history/history/paper-state.json"
          cp output/crypto-dashboard.html "$RUNNER_TEMP/crypto-history/history/dashboard.html"
          cat output/previous-paper-observations.jsonl output/crypto-paper-observations.jsonl | tail -n 8000 > "$RUNNER_TEMP/crypto-history/history/paper-observations.jsonl"
          if [ -s output/crypto-backtest.json ]; then
            cp output/crypto-backtest.json "$RUNNER_TEMP/crypto-history/history/latest-backtest.json"
          fi
          git -C "$RUNNER_TEMP/crypto-history" config user.name 'github-actions[bot]'
          git -C "$RUNNER_TEMP/crypto-history" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$RUNNER_TEMP/crypto-history" add history/
          if ! git -C "$RUNNER_TEMP/crypto-history" diff --cached --quiet; then
            git -C "$RUNNER_TEMP/crypto-history" commit -m 'data: update read-only crypto paper performance'
            git -C "$RUNNER_TEMP/crypto-history" push origin HEAD:alpha-crypto-history
          fi
      - name: Save research outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crypto-paper-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            output/crypto-paper-observations.jsonl
            output/new-paper-state.json
            output/crypto-backtest.json
            output/crypto-dashboard.html
          if-no-files-found: warn
          retention-days: 30
