[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "automated-alpha-readonly"
version = "0.1.0"
description = "Three-engine, read-only arbitrage observation research prototype"
requires-python = ">=3.10"
readme = "README.md"

[project.scripts]
automated-alpha = "alpha.__main__:main"

[tool.setuptools]
packages = ["alpha"]
