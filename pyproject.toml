[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "automated-alpha-readonly"
version = "0.5.0"
description = "Read-only arbitrage and crypto spot paper-trading research"
requires-python = ">=3.10"
readme = "README.md"

[project.scripts]
automated-alpha = "alpha.__main__:main"

[tool.setuptools]
packages = ["alpha"]
